<h2 class="sub-category">
  <span>{{ 'sheet.advantages.flaws.title' | translate }}</span>
</h2>

<div class="trait-row" *ngFor="let flaw of characterSheet.advantages.flaws; index as i; trackBy: trackByFn">
  <span class="trait-category">{{ categoryLabel($any(flaw).category) }}</span>
  <span class="trait-name">{{ flaw.name }}</span>
  <span class="trait-points">{{ flaw.level }}pt</span>
  <button
    *ngIf="characterSheet.isEditable"
    class="trait-delete"
    type="button"
    (click)="deleteFlaw(i)"
    aria-label="Eliminar"
  >✕</button>
</div>

<div
  *ngIf="characterSheet.isEditable"
  matRipple
  [matRippleCentered]="true"
  class="add-property-container"
  (click)="openAddDialog()"
>
  <mat-icon class="add-property-button">add_circle_outline</mat-icon>
  <span>Añadir defecto</span>
</div>
